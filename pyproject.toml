[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pandas-ru-io"
version = "0.1.0"
description = "Русские табличные данные в pandas: определение кодировки, числа и даты по-русски, выписки 1С, проверка ИНН, СНИЛС и счетов"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleg4311" }]
keywords = ["pandas", "russian", "cp1251", "1c", "csv", "inn"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Natural Language :: Russian",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = ["pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5", "charset-normalizer>=3", "pandas-stubs", "build"]

[project.urls]
Homepage = "https://github.com/Oleg4311/pandas-ru-io"
Issues = "https://github.com/Oleg4311/pandas-ru-io/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pandas_ru_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
warn_return_any = false  # pandas без типов возвращает Any
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF043", "B905", "RUF012"]
