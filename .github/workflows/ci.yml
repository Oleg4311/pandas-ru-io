name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: тесты (${{ matrix.os }}, Python ${{ matrix.python }}, pandas ${{ matrix.pandas }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", pandas: "2.*" }
          - { os: ubuntu-latest, python: "3.11", pandas: "2.*" }
          - { os: ubuntu-latest, python: "3.12", pandas: "3.*" }
          - { os: ubuntu-latest, python: "3.13", pandas: "3.*" }
          - { os: windows-latest, python: "3.10", pandas: "2.*" }
          - { os: windows-latest, python: "3.13", pandas: "3.*" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # сверка контрольных цифр с npm-пакетом ru-kit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" "pandas==${{ matrix.pandas }}"
      - run: python -c "import pandas; print(pandas.__version__)"
      - run: pytest
        env:
          PYTHONUTF8: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  # Колесо и архив собираются, ставятся в чистое окружение и проходят дымовую проверку
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Установка колеса в чистое окружение и проверка
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "
          import pandas_ru_io as ru
          assert ru.is_inn('7707083893')
          df = ru.read_csv_ru('Сумма;Дата\n1 234,5;05.01.2024\n'.encode('cp1251'))
          assert df['Сумма'].tolist() == [1234.5], df
          print('ok', ru.__version__)"
