name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Версия в pyproject.toml должна совпадать с тегом
        run: test "v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$GITHUB_REF_NAME"
      - run: pip install -e ".[dev]" build
      - run: ruff check . && mypy
      - run: pytest
        env:
          CI: "true"
      - run: python -m build
      - run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Подтверждение происхождения (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --title "pandas-ru-io $GITHUB_REF_NAME"
          --notes "Колесо и архив для pip: pip install https://github.com/Oleg4311/pandas-ru-io/releases/download/$GITHUB_REF_NAME/pandas_ru_io-${GITHUB_REF_NAME#v}-py3-none-any.whl. Проверьте SHA-256 из SHA256SUMS и аттестацию: gh attestation verify <файл> --repo Oleg4311/pandas-ru-io. В PyPI пакет пока не публикуется."
